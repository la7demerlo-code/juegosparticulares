<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juegos para Inicial y Jardín — E.E.S. N°7 Merlo</title>
<style>
body { margin:0; background:#eeeeee; padding:20px 0; }
.tablero { font-family:'Georgia',serif; max-width:520px; margin:0 auto; padding:10px; box-sizing:border-box; }

.tablero .intro { background:#fff8e6; border-left:5px solid #F6B40E; padding:10px 14px; border-radius:6px; font-size:0.9rem; line-height:1.4; margin-bottom:16px; text-align:center; }

.tablero .grilla { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

.tablero .cat-btn {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-decoration:none;
  background: linear-gradient(180deg, #003a75 0%, #001d3d 100%);
  color:white;
  padding:20px 8px;
  border-radius:12px;
  text-align:center;
  font-weight:bold;
  font-size:0.9rem;
  line-height:1.25;
  border:1px solid #F6B40E;
  min-height:90px;
  box-shadow:
    0 4px 0 #001229,
    0 6px 10px rgba(0,0,0,0.35),
    inset 0 1px 0 rgba(255,255,255,0.15);
  transform: translateY(0);
  transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
  cursor:pointer;
}
.tablero .cat-btn:hover {
  background: linear-gradient(180deg, #004a92 0%, #002a54 100%);
  transform: translateY(-2px);
  box-shadow:
    0 6px 0 #001229,
    0 10px 14px rgba(0,0,0,0.4),
    inset 0 1px 0 rgba(255,255,255,0.2);
}
.tablero .cat-btn:active {
  transform: translateY(3px);
  box-shadow:
    0 1px 0 #001229,
    0 2px 4px rgba(0,0,0,0.3),
    inset 0 1px 0 rgba(255,255,255,0.1);
}
.tablero .cat-btn .emoji { display:block; font-size:2rem; margin-bottom:6px; }
</style>
</head>
<body>

<div class="tablero">

  <p class="intro">🧸 <strong>Juegos para Inicial y Jardín</strong> — E.E.S. N°7 Merlo</p>

  <div class="grilla">
    <a class="cat-btn" href="inicio.html"><span class="emoji">🏠</span>Inicio</a>
    <a class="cat-btn" href="wordwall.html"><span class="emoji">🔤</span>Juegos Wordwall</a>
  </div>

</div>

</body>
</html>
